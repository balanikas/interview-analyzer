<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Timeline</title>
<style>
  :root { color-scheme:light; --bg:#e9edf3; --card:#fff; --text:#1c1c21; --muted:#5a5a66; --accent:#c4302b; --border:#b8c0cc;
          --sp-int:#1d5fb8; --sp-int-bg:#d5e4fa; --sp-guest:#6b3fa0; --sp-guest-bg:#e6d9f5;
          --sp-other:#55555f; --sp-other-bg:#e1e3e8; }
  * { box-sizing: border-box; }
  html, body { height:100%; overflow:hidden; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,sans-serif; }
  .layout { display:flex; flex-direction:column; max-width:1560px; height:100vh; margin:0 auto; }
  header { flex:none; display:flex; align-items:center; flex-wrap:wrap; gap:8px 12px; padding:10px 20px;
           background:#f6f8fb; border-bottom:1px solid var(--border); }
  header form { flex:1 1 320px; max-width:560px; }
  /* The page itself never scrolls: main fills the window below the header, and each section scrolls inside itself. */
  main { flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden; padding:16px 20px; }
  h1 { font-size:1.25rem; margin:0; }
  .row { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:8px 10px; font:inherit; color:var(--text); background:var(--card);
          border:1px solid var(--border); border-radius:8px; }
  button { padding:8px 14px; font:inherit; font-weight:600; color:#fff; background:var(--accent);
           border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #status { color:var(--muted); font-size:.85rem; }
  #status:empty { display:none; }
  #status.error { color:var(--accent); }
  /* The interview picker: a search field over the matching episodes, grouped by publisher. */
  #picker { width:min(560px, calc(100vw - 32px)); max-height:min(70vh, 640px); margin-top:10vh; padding:0; color:var(--text);
            background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,.25); }
  #picker[open] { display:flex; flex-direction:column; }
  #picker::backdrop { background:rgba(0,0,0,.3); }
  #picker .search { flex:none; padding:12px; border-bottom:1px solid var(--border); }
  #picker .search input { width:100%; }
  #audiolist { flex:1; min-height:0; overflow:auto; padding:4px 12px 12px; }
  #audiolist h3 { margin:0; padding:10px 0 4px; color:var(--muted); font-size:.72rem; font-weight:700;
                  text-transform:uppercase; letter-spacing:.04em; }
  #audiolist .none { color:var(--muted); padding:16px 0; text-align:center; font-size:.9rem; }
  #audiolist ul { list-style:none; margin:0; padding:0; }
  #audiolist button.ep { display:block; width:100%; text-align:left; padding:6px 8px; margin-bottom:2px; color:var(--text);
                         background:none; font-weight:500; font-size:.85rem; border-radius:6px; }
  #audiolist button.ep:hover, #audiolist button.ep:focus-visible { background:var(--bg); }
  #audiolist button.ep.active { background:var(--bg); box-shadow:inset 3px 0 0 var(--accent); }
  #audiolist button.ep:disabled { opacity:.6; }
  #audiolist .meta { display:block; color:var(--muted); font-size:.75rem; }
  #logbox { max-width:760px; margin:0 auto; padding:14px 16px; min-height:0; max-height:100%; overflow:auto; background:#fff; color:#1c1c21;
            border:1px solid var(--border); border-radius:10px; font:.85rem/1.6 ui-monospace,monospace; }
  #log > div::before { content:"> "; color:#8a8a96; }
  #log .ok { color:#1a7f43; }
  #log .err { color:#c4302b; }
  #log button { margin-top:10px; }
  .empty { color:var(--muted); padding:48px 0; text-align:center; }
  .now { flex:1; min-width:0; display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .now #nowtitle { font-size:.88rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .now a { color:var(--text); }
  .now a:hover { color:var(--accent); }
  .now .cost { color:var(--muted); font-size:.8rem; white-space:nowrap; cursor:help; }
  .transcript { max-height:70vh; overflow:auto; background:var(--card);
                border:1px solid var(--border); border-radius:10px; }
  .thead { position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:8px;
           flex-wrap:wrap; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--border); }
  .thead h2 { margin:0; font-size:.95rem; }
  #tlines { list-style:none; margin:0; padding:8px 0; }
  #tlines li { padding:4px 16px 4px 13px; font-size:.9rem; border-left:3px solid transparent; }
  #tlines li { cursor:pointer; }
  #tlines li.cur { outline:2px solid var(--accent); outline-offset:-2px; }
  #tlines .t { font:600 .78rem ui-monospace,monospace; color:var(--muted); margin-right:6px; }
  .spk { display:inline-block; font-size:.72rem; font-weight:700; line-height:1.4; padding:0 6px; border-radius:4px;
         margin-right:5px; vertical-align:1px; }
  .spk.interviewer { color:var(--sp-int); background:var(--sp-int-bg); }
  .spk.interviewee { color:var(--sp-guest); background:var(--sp-guest-bg); }
  .spk.other { color:var(--sp-other); background:var(--sp-other-bg); }
  /* A section heading's explanation, shown on hover or keyboard focus of the (i). */
  /* The tooltip itself is #infotip, one element fixed to the window and placed by showInfo(), so a narrow column can't clip it. */
  .info { display:inline-block; margin-left:4px; color:var(--muted); font-size:.8rem; font-weight:400; cursor:help; }
  .info > .legend { display:none; }
  #infotip { position:fixed; z-index:6; width:max-content; max-width:min(360px, calc(100vw - 32px)); overflow:auto;
             padding:8px 12px; background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px;
             box-shadow:0 4px 16px rgba(0,0,0,.18); font-size:.82rem; font-weight:400; line-height:1.45; }
  #infotip.wide { max-width:min(520px, calc(100vw - 32px)); }
  .treebox { background:var(--card); border:1px solid var(--border); border-radius:10px; margin-bottom:16px; }
  .treebox h2 { margin:0; padding:10px 16px 0; font-size:.95rem; }
  .stats { border-collapse:collapse; width:100%; font-size:.85rem; margin:8px 0; }
  .stats th { text-align:right; font-weight:600; color:var(--muted); font-size:.75rem; padding:4px 10px; white-space:nowrap; }
  .stats td { text-align:right; padding:6px 10px; border-top:1px solid var(--border); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .stats th:first-child, .stats td:first-child { text-align:left; }
  .stats th:first-child, .stats td:first-child { position:sticky; left:0; z-index:1; background:var(--card); box-shadow:1px 0 0 var(--border); }
  .stats .who { display:flex; align-items:center; gap:6px; }
  .stats .who .name { white-space:nowrap; }
  .stats .share { display:flex; align-items:center; gap:6px; justify-content:flex-end; }
  .stats .bar { width:80px; height:6px; border-radius:3px; background:var(--border); overflow:hidden; }
  .stats .bar > span { display:block; height:100%; background:var(--sp-int); }
  #interruptions { list-style:none; margin:8px 0 0; padding:0; border-top:1px solid var(--border); max-height:240px; overflow:auto; }
  #interruptions li { padding:6px 16px; font-size:.88rem; cursor:pointer; border-bottom:1px solid var(--border); }
  #interruptions li:hover { background:var(--bg); }
  #interruptions .t { font:600 .78rem ui-monospace,monospace; color:var(--muted); margin-right:6px; }
  #interruptions .kind { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); margin-left:6px; }
  #interruptions .kind.dodge { color:var(--sp-int); }
  #interruptions .kind.guest { color:var(--muted); }
  #interruptions .why { display:block; color:var(--muted); font-size:.8rem; }
  #interruptions .none { cursor:default; color:var(--muted); }
  #speechline .cut path { stroke:var(--accent); stroke-width:2.5; stroke-linecap:round; fill:none; }
  #speechline .cut { cursor:pointer; }
  #speechline .cuthit { fill:var(--card); fill-opacity:.01; }
  #speechline .cut:hover .cuthit { fill-opacity:.9; stroke:var(--accent); }
  #speechline .cutlink { stroke:var(--accent); stroke-width:1.5; stroke-dasharray:3 3; pointer-events:none; }
  .scorehead { margin:10px 16px 0; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .score { display:flex; flex-wrap:wrap; gap:8px 24px; padding:10px 16px 4px; }
  .score button { font:inherit; font-size:.8rem; color:var(--muted); text-align:left; background:none; cursor:pointer;
                  border:1px solid transparent; border-radius:8px; padding:4px 8px; margin:-4px -8px; }
  .score button:hover { border-color:var(--border); }
  .score button.on { border-color:var(--accent); background:var(--bg); }
  /* The Exchanges legend: a tooltip with markup in it rather than plain text, copied from #legend into #infotip when shown. */
  #infotip p { margin:0 0 8px; }
  #infotip > div { display:grid; grid-template-columns:max-content 1fr; gap:4px 10px; align-items:baseline; margin-top:8px; }
  #infotip h3 { grid-column:1 / -1; margin:0; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  #infotip .tag, #exchanges .tag { display:inline-block; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
                    padding:0 6px; margin-right:4px; border-radius:4px; color:var(--muted); background:var(--bg); }
  #infotip .tag.bad, #exchanges .tag.bad { color:var(--accent); }
  #infotip .tag.good, #exchanges .tag.good { color:var(--sp-int); }
  #infotip .kind { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); }
  #infotip .kind.dodge { color:var(--sp-int); }
  #infotip .kind.guest { color:var(--muted); }
  .score b { display:block; font-size:1.25rem; color:var(--text); font-variant-numeric:tabular-nums; }
  #exchanges { list-style:none; margin:8px 0 0; padding:0; border-top:1px solid var(--border); max-height:320px; overflow:auto; }
  #exchanges li { padding:6px 16px; font-size:.88rem; cursor:pointer; border-bottom:1px solid var(--border); }
  #exchanges li:hover { background:var(--bg); }
  #exchanges li.cur { outline:2px solid var(--accent); outline-offset:-2px; }
  #exchanges .t { font:600 .78rem ui-monospace,monospace; color:var(--muted); margin-right:6px; }
  #exchanges .why { display:block; color:var(--muted); font-size:.8rem; }
  .player { position:sticky; top:0; z-index:4; display:flex; align-items:center; gap:10px; padding:6px 16px; margin-top:4px;
            background:var(--card); border-bottom:1px solid var(--border); }
  .player button { flex:none; width:28px; height:28px; padding:0; border-radius:50%; border:1px solid var(--border);
                   background:var(--bg); color:var(--text); cursor:pointer; font-size:.75rem; line-height:1; }
  .player button:hover { color:var(--accent); border-color:var(--accent); }
  .player button.skip { width:auto; padding:0 8px; border-radius:14px; font-size:.7rem; }
  .player #seek { flex:1 1 120px; min-width:80px; max-width:360px; accent-color:var(--accent); }
  .player .clock { flex:none; font:600 .78rem ui-monospace,monospace; color:var(--muted); }
  .tlwrap { display:flex; }
  .tlwrap .treescroll { flex:1; min-width:0; padding-left:0; }
  #speechlabels { flex:none; display:block; margin-left:8px; background:var(--card); }
  #speechline .playhead { stroke:var(--accent); stroke-width:2; pointer-events:none; }
  .treescroll { overflow-x:auto; padding:0 8px 8px; }
  #speechline { display:block; }
  #speechline .band, #speechlabels .band { fill:var(--muted); fill-opacity:.07; }
  #speechlabels .who { fill:var(--text); font-size:12px; font-weight:600; dominant-baseline:central; }
  .cols { flex:1; min-height:0; display:grid; grid-template-columns:280px minmax(0, 1fr) 380px;
          grid-template-rows:minmax(0, 1fr); gap:16px; }
  /* Each column is as tall as main. Its sections share that height, and their lists and the transcript scroll inside. */
  .colleft, .colmain, .colside { min-width:0; min-height:0; display:flex; flex-direction:column; gap:16px; overflow:auto; }
  .cols .treebox { margin:0; }
  #exbox { flex:none; }
  #statsbox { flex:0 1 auto; min-height:96px; overflow:auto; }
  #speechbox { flex:none; }
  .colmain .transcript { flex:1 1 0; min-height:160px; max-height:none; }
  .colside > .treebox { display:flex; flex-direction:column; min-height:120px; }
  .colside > .treebox > h2 { flex:none; }
  #intbox { flex:0 1 auto; max-height:40%; }
  #exlistbox { flex:1 1 0; }
  .colside:has(> #exlistbox[hidden]) > #intbox { max-height:none; }
  .colside #interruptions, .colside #exchanges { flex:1 1 auto; min-height:0; max-height:none; }
  /* No metrics (questions not judged): drop the left column rather than leave it empty. */
  .cols:has(#exbox[hidden]) { grid-template-columns:minmax(0, 1fr) 380px; }
  .colleft:has(> #exbox[hidden]) { display:none; }
  #speechline .grid { stroke:var(--border); stroke-width:1; }
  #speechline .axis { fill:var(--muted); font-size:10px; text-anchor:middle; }
  #speechline .speech { fill:var(--sp-int); stroke:var(--card); stroke-width:1; cursor:pointer; }
  #speechline.filtered .speech { fill-opacity:.2; }
  #speechline.filtered .speech.hl { fill:var(--accent); fill-opacity:1; }
  #speechline .speech.selected { stroke:var(--text); stroke-width:2.5; }
  #tip { position:fixed; z-index:10; max-width:min(440px, calc(100vw - 8px)); padding:8px 12px; pointer-events:none;
         background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px;
         box-shadow:0 4px 16px rgba(0,0,0,.18); font-size:.85rem; line-height:1.45; }
  #tip .tip-head { font-size:.75rem; font-weight:700; color:var(--muted); margin-bottom:4px; }
  #tip .tip-body { max-height:min(45vh, 360px); overflow:hidden; white-space:pre-wrap; }
  #tip .tip-body.clipped { -webkit-mask-image:linear-gradient(#000 80%, transparent); mask-image:linear-gradient(#000 80%, transparent); }
  #tip .tip-foot { font-size:.75rem; color:var(--muted); margin-top:6px; }
  [hidden] { display:none !important; }
  /* Two columns: the timeline and transcript on the left, metrics above interruptions and exchanges on the right. */
  @media (max-width:1300px) {
    .cols, .cols:has(#exbox[hidden]) { grid-template-columns:minmax(0, 1fr) 340px; grid-template-rows:auto minmax(0, 1fr); }
    .colmain { grid-column:1; grid-row:1 / span 2; }
    .colleft { grid-column:2; grid-row:1; max-height:45vh; }
    .colside { grid-column:2; grid-row:2; }
    .cols:has(#exbox[hidden]) .colside { grid-row:1 / span 2; }
  }
  /* Too narrow for side-by-side sections: stack them and let the page scroll after all. */
  @media (max-width:900px) {
    html, body { height:auto; overflow:auto; }
    .layout { display:block; height:auto; }
    main { display:block; overflow:visible; }
    .cols, .colleft, .colmain, .colside { display:block; overflow:visible; max-height:none; }
    .cols .treebox { margin-bottom:16px; }
    .colmain .transcript { max-height:60vh; margin-bottom:16px; }
    #logbox { max-height:70vh; }
    .colside #interruptions { max-height:240px; }
    .colside #exchanges { max-height:320px; }
  }

</style>
</head>
<body>
<div class="layout">
  <header>
    <h1>Interview Timeline</h1>
    <button id="pick" type="button">Select</button>
    <form id="form">
      <div class="row">
        <input id="turl" type="url" placeholder="Paste a link to an audio file" aria-label="Link to an audio file">
        <button id="go">Analyze</button>
      </div>
    </form>
    <div id="status" role="status"></div>
  </header>

  <main>
    <section id="logbox" hidden aria-label="Analysis log"><div id="log" aria-live="polite"></div></section>
    <p class="empty" id="empty">Select an interview or paste a link.</p>
    <div id="result" class="cols" hidden>
      <div class="colleft">
      <div class="treebox" id="exbox" hidden>
        <h2>Question and answer metrics<span class="info" tabindex="0" data-tip="Each host question is judged on how it was asked and how the guest answered it. The host and the guest are scored separately, so an evasive guest doesn't count against a good host. Judged automatically from the text alone, so treat it as an estimate. Click a figure to highlight those moments on the timeline.">ⓘ</span></h2>
        <h3 class="scorehead">Host</h3>
        <div class="score" id="hostscore"></div>
        <h3 class="scorehead">Guest</h3>
        <div class="score" id="guestscore"></div>
      </div>
      </div>
      <div class="colmain">
      <div class="treebox" id="statsbox">
        <h2>Speakers<span class="info" tabindex="0" data-tip="Names are picked up from what is said. Hosts are worked out from who asks the questions.">ⓘ</span></h2>
        <div class="treescroll"><table class="stats" id="stats"></table></div>
      </div>
      <div class="treebox" id="speechbox">
        <h2>Timeline<span class="info" tabindex="0" data-tip="One row per speaker, one bar per stretch of speech. Click a bar to play from there and highlight it in the transcript. A cross marks an interruption.">ⓘ</span></h2>
        <div class="player">
          <button id="backbtn" class="skip" type="button" aria-label="Back 10 seconds" title="Back 10 s">−10</button>
          <button id="playbtn" type="button" aria-label="Play">▶</button>
          <button id="fwdbtn" class="skip" type="button" aria-label="Forward 10 seconds" title="Forward 10 s">+10</button>
          <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek">
          <span class="clock" id="clock">00:00 / 00:00</span>
          <span class="now"><span id="nowtitle"></span><span class="cost" id="cost"></span></span>
          <audio id="player" preload="metadata"></audio>
        </div>
        <div class="tlwrap">
          <svg id="speechlabels" aria-hidden="true"></svg>
          <div class="treescroll"><svg id="speechline" role="group" aria-label="Speaker timeline"></svg></div>
        </div>
      </div>
      <section class="transcript" id="transcript" aria-label="Transcript">
        <div class="thead">
          <h2>Transcript<span class="info" tabindex="0" data-tip="Click a line to play from there.">ⓘ</span></h2>
        </div>
        <ol id="tlines"></ol>
      </section>
      </div>
      <div class="colside">
      <div class="treebox" id="intbox" hidden>
        <h2><span id="inttitle">Interruptions</span><span class="info" tabindex="0" data-tip="One speaker cutting in while another is mid-thought, or talking over them. Detected automatically, so treat it as an estimate. Click one to hear it.">ⓘ</span></h2>
        <ol id="interruptions"></ol>
      </div>
      <div class="treebox" id="exlistbox" hidden>
        <h2>Exchanges<span class="info" tabindex="0">ⓘ<span class="legend" id="legend"><p>Every host question with the guest's reply, and the verdicts for each. Click one to hear it.</p></span></span></h2>
        <ol id="exchanges"></ol>
      </div>
      </div>
    </div>
  </main>
</div>

<dialog id="picker" aria-label="Select an interview">
  <div class="search"><input id="search" type="search" placeholder="Filter by title" aria-label="Filter by title" autocomplete="off"></div>
  <div id="audiolist" aria-label="Downloaded audio"></div>
</dialog>

<div id="infotip" role="tooltip" hidden></div>
<script type="module" src="client/main.js"></script>
</body>
</html>
